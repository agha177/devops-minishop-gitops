apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minishop-dev

resources:
- ../../base
- serviceaccount.yaml

replicas:
- count: 1
  name: backend
- count: 1
  name: frontend


images:
- name: minishop-backend
  newName: 861097501014.dkr.ecr.us-east-1.amazonaws.com/minishop-backend
  newTag: 10d4272
- name: minishop-frontend
  newName: 861097501014.dkr.ecr.us-east-1.amazonaws.com/minishop-frontend
  newTag: 10d4272

patches:
- path: serviceaccount-patch.yaml
