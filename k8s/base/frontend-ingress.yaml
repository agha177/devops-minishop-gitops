apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minishop-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: minishop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
